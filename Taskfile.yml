# https://taskfile.dev

version: "3"

vars:
  BUILD_DIR: bin
  BINARY: claudemod
  INSTALL_DIR: ~/.local/bin
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE:
    sh: date -u '+%Y-%m-%dT%H:%M:%SZ'
  LDFLAGS: >-
    -X github.com/tab58/claudemod/internal/version.version={{.VERSION}}
    -X github.com/tab58/claudemod/internal/version.commit={{.COMMIT}}
    -X github.com/tab58/claudemod/internal/version.date={{.DATE}}

tasks:
  run:
    cmds:
      - go run -ldflags '{{.LDFLAGS}}' cmd/claudemod/main.go

  build:
    cmds:
      - go build -ldflags '{{.LDFLAGS}}' -o {{.BUILD_DIR}}/{{.BINARY}} cmd/claudemod/main.go

  test:
    cmds:
      - go test -cover ./...

  test-race:
    cmds:
      - go test -race ./...

  vet:
    cmds:
      - go vet ./...

  lint:
    cmds:
      - task: vet
      - which staticcheck > /dev/null 2>&1 && staticcheck ./... || echo "staticcheck not installed, skipping"

  clean:
    cmds:
      - rm -f {{.BUILD_DIR}}/{{.BINARY}}

  install:
    cmds:
      - task: build
      - mkdir -p {{.INSTALL_DIR}}
      - cp {{.BUILD_DIR}}/{{.BINARY}} {{.INSTALL_DIR}}/{{.BINARY}}
