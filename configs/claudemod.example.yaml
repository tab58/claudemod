# claudemod configuration
# Copy to ~/.claudemod/config.yaml

# Path to claude binary (optional, auto-detected if empty)
claude_path: ""

# Directory for log files
log_dir: "~/.claudemod/logs"

# Plugins
plugins:
  - name: logger
    enabled: true
    options:
      # Log output chunks to JSONL files
      log_input: true
      log_output: true

  - name: filter
    enabled: false
    options:
      # Regex patterns to redact from logs
      patterns:
        - "sk-[a-zA-Z0-9]{20,}"
        - "AKIA[0-9A-Z]{16}"

  - name: inject
    enabled: false
    options:
      # Text to inject into stdin on startup
      text: ""
