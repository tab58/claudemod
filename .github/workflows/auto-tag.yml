name: Auto Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump semver tag from conventional commits
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Get latest semver tag (default v0.0.0 if none)
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1 || true)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "Latest tag: $LATEST_TAG"

          # Parse major.minor.patch, stripping pre-release/build metadata
          VERSION="${LATEST_TAG#v}"
          VERSION_CORE=$(echo "$VERSION" | sed 's/[-+].*//')
          MAJOR=$(echo "$VERSION_CORE" | cut -d. -f1)
          MINOR=$(echo "$VERSION_CORE" | cut -d. -f2)
          PATCH=$(echo "$VERSION_CORE" | cut -d. -f3)

          # Get commit messages since last tag
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:'%s')
          else
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:'%s')
          fi

          if [ -z "$COMMITS" ]; then
            echo "No new commits since $LATEST_TAG"
            exit 0
          fi

          echo "Commits since $LATEST_TAG:"
          echo "$COMMITS"

          # Determine bump type from conventional commit prefixes
          # Priority: breaking change (major) > feat (minor) > fix (patch)
          # Matches: type!:, type(scope)!: where ! signals a breaking change
          BUMP=""
          if echo "$COMMITS" | grep -qE '^(feat|fix|refactor|perf|chore)(\(.*\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\(.*\))?:'; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qE '^fix(\(.*\))?:'; then
            BUMP="patch"
          fi

          if [ -z "$BUMP" ]; then
            echo "No feat: or fix: commits found — skipping tag"
            exit 0
          fi

          # Apply bump
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Creating tag: $NEW_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "$NEW_TAG"
